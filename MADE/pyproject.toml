[project]
name = "made"
version = "0.1.0"
description = "Multi-Objective Agent Decision Engine (EPM+MODM) prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "torch>=2.13",
    "transformers>=4.44",
    "spacy>=3.8",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.experiment", "core.decision", "core.epm", "core.modm", "core.privacy", "api", "storage", "experiments"]
