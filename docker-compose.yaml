services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - MEMORY_DB_PATH=/data/memory.db
    volumes:
      - app-data:/data
    depends_on:
      - searxng
      - scrapling
      - made

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:ro
    ports:
      - "127.0.0.1:8080:8080"

  scrapling:
    build: ./Scrapling
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"

  made:
    build: ./MADE
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      - MADE_DB_PATH=/data/made.db
    volumes:
      - made-data:/data

  open-webui:
    build: ./open-webui
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_OLLAMA_API=false
      - ENABLE_API_KEYS=true
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
  made-data:
  app-data:
